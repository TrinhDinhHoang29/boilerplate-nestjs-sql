services:
  platform-app-backend:
    build:
      dockerfile: dockerfile
      context: .
    env_file:
      - .env.dev
    volumes:
      - ./:/app
    networks:
      - db-bridge
    depends_on:
      - database
  database:
    image: postgres:17
    env_file:
      - .env.dev
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - 0.0.0.0:${DATABASE_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    networks:
      - db-bridge
networks:
  db-bridge:
volumes:
  postgres_data:
